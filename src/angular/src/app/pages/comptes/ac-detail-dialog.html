<app-side-panel
  [title]="account.client"
  [subtitle]="account.id + ' · ' + account.type + ' · profil ' + account.profile.toLowerCase() + ' · gérant ' + account.manager"
  accent="var(--ink-brand)"
  [icon]="icon"
  [openPct]="40"
  [maxPct]="70"
  [footer]="true"
  cancelLabel="OK"
  cancelKind="ok"
  [note]="state.label"
  (closed)="close()"
  (pinnedChange)="onPinnedChange($event)"
>
  <div class="ac-det-card">
    <div class="ac-det-identity-head">
      <mat-icon svgIcon="file-text" style="font-size:16px;color:#ffffff"></mat-icon>
      <h2>Identité du compte</h2>
      <span class="ac-det-state-pill" [style.background]="state.bg" [style.color]="state.fg">
        <span class="ac-det-dot" [style.background]="state.fg"></span>
        {{ state.label }}
      </span>
    </div>
    <div class="ac-det-identity-grid">
      @for (i of identity; track i.label) {
        <div class="ac-det-identity-row">
          <span class="ac-det-identity-label">{{ i.label }}</span>
          <span class="ac-det-identity-value">{{ i.value }}</span>
        </div>
      }
    </div>
  </div>

  <!-- Les personnes rattachées au dossier : c'est le seul fait de la fiche qu'aucun autre écran
       ne porte. L'encart de l'onglet Gérer dit le reste — client, statut, encours, comptes titre. -->
  <div class="ac-det-card">
    <div class="ac-det-holders-head">
      <h3>Titulaires et mandataires</h3>
      <span class="ac-det-holders-count">{{ holdersNote }}</span>
    </div>
    @for (h of holders; track h.name) {
      <div class="ac-det-holder-row">
        <span class="ac-det-holder-initials">{{ h.initials }}</span>
        <span class="ac-det-holder-body">
          <span class="ac-det-holder-name">{{ h.name }}</span>
          <span class="ac-det-holder-meta">{{ h.role }} · {{ h.detail }}</span>
        </span>
        <span class="ac-det-holder-kyc" [style.background]="h.kycBg" [style.color]="h.kycFg">{{ h.kyc }}</span>
      </div>
    }
  </div>
</app-side-panel>
