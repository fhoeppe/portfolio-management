<app-side-panel
  [title]="panelTitle"
  [subtitle]="subtitle()"
  accent="var(--ink-brand)"
  [icon]="icon"
  [flush]="true"
  [openPct]="40"
  [maxPct]="75"
  [footer]="true"
  [showSubmit]="true"
  [submitLabel]="submitLabel"
  cancelLabel="Annuler"
  cancelKind="close"
  [note]="verdict()"
  (submitted)="confirm()"
  (closed)="close()"
  (pinnedChange)="onPinnedChange($event)"
>
  @for (g of groups(); track g.title) {
    <div class="ac-rec-group">
      <div class="ac-rec-group-head">
        <span class="ac-rec-group-title">{{ g.title }}</span>
        <span class="ac-rec-group-state" [style.color]="g.stateColor">{{ g.state }}</span>
      </div>
      @for (r of g.rows; track r.label) {
        <div class="ac-rec-row">
          <span class="ac-rec-row-label">{{ r.label }}</span>
          @if (r.badge) {
            <span class="ac-rec-row-badge" [style.background]="r.badgeBg" [style.color]="r.badgeFg">
              <span class="ac-rec-row-dot" [style.background]="r.badgeFg"></span>
              {{ r.badge }}
            </span>
          }
          <span class="ac-rec-row-value" [style.color]="r.color">{{ r.value }}</span>
          @if (r.href) {
            <a [href]="r.href" target="_blank" rel="noopener" class="ac-rec-row-link" title="Ouvrir le site du broker dans un nouvel onglet">
              <mat-icon svgIcon="external-link-alt" style="font-size:13px"></mat-icon>
            </a>
          }
        </div>
      }
    </div>
  }
</app-side-panel>
