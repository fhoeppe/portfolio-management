<div class="ti-table-scroll">
  <table mat-table [dataSource]="shownRows()" [trackBy]="trackBy" class="ti-table">
    <ng-container matColumnDef="isin">
      <th mat-header-cell *matHeaderCellDef class="ti-th ti-th-isin">
        <button type="button" class="ti-sort-btn" [style.color]="sortHeader('isin').color" [style.font-weight]="sortHeader('isin').weight" [matTooltip]="sortHeader('isin').title" (click)="onSort('isin')">
          ISIN
          <span class="ti-sort-arrow" [style.opacity]="sortHeader('isin').opacity" [style.transform]="'rotate(' + sortHeader('isin').rotate + ')'">
            <mat-icon svgIcon="sort" style="font-size:13px"></mat-icon>
          </span>
        </button>
      </th>
      <td mat-cell *matCellDef="let row" class="ti-td ti-td-isin">{{ row.r.isin }}</td>
    </ng-container>
    <ng-container matColumnDef="ticker">
      <th mat-header-cell *matHeaderCellDef class="ti-th ti-th-ticker">
        <button type="button" class="ti-sort-btn" [style.color]="sortHeader('ticker').color" [style.font-weight]="sortHeader('ticker').weight" [matTooltip]="sortHeader('ticker').title" (click)="onSort('ticker')">
          Ticker
          <span class="ti-sort-arrow" [style.opacity]="sortHeader('ticker').opacity" [style.transform]="'rotate(' + sortHeader('ticker').rotate + ')'">
            <mat-icon svgIcon="sort" style="font-size:13px"></mat-icon>
          </span>
        </button>
      </th>
      <td mat-cell *matCellDef="let row" class="ti-td ti-td-ticker">{{ row.r.symbol }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="ti-th">
        <button type="button" class="ti-sort-btn" [style.color]="sortHeader('name').color" [style.font-weight]="sortHeader('name').weight" [matTooltip]="sortHeader('name').title" (click)="onSort('name')">
          Nom
          <span class="ti-sort-arrow" [style.opacity]="sortHeader('name').opacity" [style.transform]="'rotate(' + sortHeader('name').rotate + ')'">
            <mat-icon svgIcon="sort" style="font-size:13px"></mat-icon>
          </span>
        </button>
      </th>
      <td mat-cell *matCellDef="let row" class="ti-td">{{ row.r.name }}</td>
    </ng-container>
    <ng-container matColumnDef="place">
      <th mat-header-cell *matHeaderCellDef class="ti-th ti-th-place">
        <button type="button" class="ti-sort-btn" [style.color]="sortHeader('place').color" [style.font-weight]="sortHeader('place').weight" [matTooltip]="sortHeader('place').title" (click)="onSort('place')">
          Place boursière
          <span class="ti-sort-arrow" [style.opacity]="sortHeader('place').opacity" [style.transform]="'rotate(' + sortHeader('place').rotate + ')'">
            <mat-icon svgIcon="sort" style="font-size:13px"></mat-icon>
          </span>
        </button>
      </th>
      <td mat-cell *matCellDef="let row" class="ti-td">{{ row.r.market }}</td>
    </ng-container>
    <ng-container matColumnDef="currency">
      <th mat-header-cell *matHeaderCellDef class="ti-th ti-th-currency">
        <button type="button" class="ti-sort-btn" [style.color]="sortHeader('currency').color" [style.font-weight]="sortHeader('currency').weight" [matTooltip]="sortHeader('currency').title" (click)="onSort('currency')">
          Devise
          <span class="ti-sort-arrow" [style.opacity]="sortHeader('currency').opacity" [style.transform]="'rotate(' + sortHeader('currency').rotate + ')'">
            <mat-icon svgIcon="sort" style="font-size:13px"></mat-icon>
          </span>
        </button>
      </th>
      <td mat-cell *matCellDef="let row" class="ti-td">{{ row.r.currency }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="ti-th ti-th-status">
        <button type="button" class="ti-sort-btn" [style.color]="sortHeader('status').color" [style.font-weight]="sortHeader('status').weight" [matTooltip]="sortHeader('status').title" (click)="onSort('status')">
          Statut
          <span class="ti-sort-arrow" [style.opacity]="sortHeader('status').opacity" [style.transform]="'rotate(' + sortHeader('status').rotate + ')'">
            <mat-icon svgIcon="sort" style="font-size:13px"></mat-icon>
          </span>
        </button>
      </th>
      <td mat-cell *matCellDef="let row" class="ti-td">
        <span class="ti-status-badge" [style.background]="row.r.tagBg" [style.color]="row.r.tagFg" [matTooltip]="row.r.statusHint">
          <span class="ti-status-dot" [style.background]="row.r.dotColor"></span>
          {{ row.r.status }}
        </span>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="ti-th ti-th-actions">Action</th>
      <td mat-cell *matCellDef="let row" class="ti-td ti-td-actions">
        <span class="ti-row-actions">
          <button type="button" class="ti-eye-btn" matTooltip="Ouvrir la fiche du titre" (click)="requestOpen(row.r.ticker)">
            <mat-icon svgIcon="eye" style="font-size:14px"></mat-icon>
          </button>
          <button type="button" class="ti-del-btn" [disabled]="row.r.lockDelete" [matTooltip]="row.r.deleteTitle" (click)="requestRemove(row.r.ticker)">
            <mat-icon svgIcon="shopping-bag" style="font-size:14px"></mat-icon>
          </button>
        </span>
      </td>
    </ng-container>

    <!-- Colonnes de la seconde ligne d'en-tête (filtres) : MatTable ne rend qu'un jeu de
         cellules par définition de colonne, il faut donc des colonnes distinctes pour la
         seconde `matHeaderRowDef`. -->
    <ng-container matColumnDef="isinFilter">
      <th mat-header-cell *matHeaderCellDef class="ti-th-filter"><input class="ti-text-filter" placeholder="Tous" [value]="colIsin()" (input)="setColumnFilter('colIsin', $any($event.target).value)" /></th>
    </ng-container>
    <ng-container matColumnDef="tickerFilter">
      <th mat-header-cell *matHeaderCellDef class="ti-th-filter">
        <app-ti-multiselect [options]="tickerOptions()" [selected]="tickPick()" [allSelected]="tickPick().size > 0 && tickPick().size === tickerOptions().length" triggerLabel="Tous" (toggle)="toggleTick($event)" (toggleAll)="toggleAllTick()"></app-ti-multiselect>
      </th>
    </ng-container>
    <ng-container matColumnDef="nameFilter">
      <th mat-header-cell *matHeaderCellDef class="ti-th-filter"><input class="ti-text-filter" placeholder="Tous" [value]="colName()" (input)="setColumnFilter('colName', $any($event.target).value)" /></th>
    </ng-container>
    <ng-container matColumnDef="placeFilter">
      <th mat-header-cell *matHeaderCellDef class="ti-th-filter">
        <app-ti-multiselect [options]="placeOptions()" [selected]="placePick()" [allSelected]="placePick().size > 0 && placePick().size === placeOptions().length" triggerLabel="Tous" (toggle)="togglePlace($event)" (toggleAll)="toggleAllPlace()"></app-ti-multiselect>
      </th>
    </ng-container>
    <ng-container matColumnDef="currencyFilter">
      <th mat-header-cell *matHeaderCellDef class="ti-th-filter">
        <app-ti-multiselect [options]="currencyOptions()" [selected]="curPick()" [allSelected]="curPick().size > 0 && curPick().size === currencyOptions().length" triggerLabel="Tous" (toggle)="toggleCur($event)" (toggleAll)="toggleAllCur()"></app-ti-multiselect>
      </th>
    </ng-container>
    <ng-container matColumnDef="statusFilter">
      <th mat-header-cell *matHeaderCellDef class="ti-th-filter">
        @if (statusFilterable()) {
        <app-ti-multiselect [options]="statusOptions()" [selected]="statPick()" [allSelected]="statPick().size > 0 && statPick().size === statusOptions().length" triggerLabel="Tous" (toggle)="toggleStat($event)" (toggleAll)="toggleAllStat()"></app-ti-multiselect>
      }
      </th>
    </ng-container>
    <ng-container matColumnDef="actionsFilter">
      <th mat-header-cell *matHeaderCellDef class="ti-th-filter"></th>
    </ng-container>

    <!-- En-tête de section « grouper par statut » : une seule cellule qui couvre les sept
         colonnes, d'où sa propre colonne et sa propre ligne. -->
    <ng-container matColumnDef="uniGroupHead">
      <td mat-cell *matCellDef="let row" colspan="7" class="ti-group-cell">
        <span class="ti-group-tag" [style.background]="row.g.tagBg" [style.color]="row.g.tagFg">
          <span class="ti-group-dot" [style.background]="row.g.tagFg"></span>
          {{ row.g.label }}
        </span>
        <span class="ti-group-count">{{ row.g.count }}</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns" class="ti-table-header-row"></tr>
    <tr mat-header-row *matHeaderRowDef="filterColumns" class="ti-filter-row"></tr>
    <tr mat-row *matRowDef="let row; columns: groupColumns; when: isGroupRow" class="ti-group-row"></tr>
    <!-- La ligne n'ouvre plus rien : c'est le bouton œil de la colonne Action qui le fait. Une
         ligne entière cliquable rendait tout clic risqué — sélectionner un ISIN pour le copier
         ouvrait le panneau — et n'annonçait le geste que par une infobulle. Le bouton le dit. -->
    <tr mat-row *matRowDef="let row; columns: columns" class="ti-row"></tr>
  </table>
</div>
@if (isEmpty()) {
  <p class="ti-empty-note">{{ emptyNote() }}</p>
}
