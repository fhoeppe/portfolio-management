<div class="pm-card">
  <div class="pm-card-header" [class.pm-card-header-open]="open()">
    <button type="button" class="pm-card-toggle" [attr.aria-label]="open() ? 'Replier' : 'Développer'" (click)="toggle()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class.pm-card-chev-closed]="!open()">
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </button>
    @if (icon(); as ic) {
      <span class="pm-card-icon"><app-icon [shapes]="ic" [size]="32" [strokeWidth]="1.6" /></span>
    }
    <h2 class="pm-card-title" (click)="toggle()">{{ title() }}</h2>
    @if (note()) {
      <span class="pm-card-note">{{ note() }}</span>
    }
    <ng-content select="[card-actions]" />
  </div>
  @if (open()) {
    <ng-content />
  }
</div>
