<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-a8ba1f5f-22ba-47e9-afbf-11d23530863e/styles.css">
  <style>
    [data-component="GuidePage"] { --ink-brand: #002a6e; --surface: var(--theme-surface, #ffffff); container-type: inline-size; }
    [data-component="GuidePage"], [data-component="GuidePage"] * { font-family: Aptos, "Aptos Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; box-sizing: border-box; }
    [data-component="GuidePage"] input { font-family: inherit; }
    @container (max-width: 900px) {
      [data-guide-split] { grid-template-columns: minmax(0, 1fr) !important; }
      [data-guide-tabs] { flex-wrap: wrap; }
    }
    [data-component="GuidePage"] h1, [data-component="GuidePage"] h2, [data-component="GuidePage"] h3 { color: #002a6e; }
    [data-component="GuidePage"] svg:not(button svg):not(a svg):not([style*="color"]) { color: var(--ink-brand); }
    [data-component="GuidePage"] input:focus, [data-component="GuidePage"] select:focus, [data-component="GuidePage"] textarea:focus { outline: none; border-color: #003da5; box-shadow: 0 0 0 1px rgba(0,61,165,0.34), 0 0 0 3px rgba(0,61,165,0.10); }
    [data-component="GuidePage"] input:focus-visible, [data-component="GuidePage"] select:focus-visible, [data-component="GuidePage"] textarea:focus-visible { outline: none; }
    /* mat-button : boutons Angular Material — libellé en capitales, transition et halo de focus */
    [data-component="GuidePage"] button { font-family: inherit; letter-spacing: 0.03em; transition: background-color 180ms cubic-bezier(0.4,0,0.2,1), box-shadow 180ms cubic-bezier(0.4,0,0.2,1), color 140ms ease, filter 140ms ease; }
    [data-component="GuidePage"] button:not([aria-label]):not([title=""]) { text-transform: none; }
    [data-component="GuidePage"] button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0,61,165,0.28); }
    [data-component="GuidePage"] button:active { filter: brightness(0.94); }
    [data-component="GuidePage"] button[disabled] { opacity: 0.42; cursor: not-allowed; filter: none; }
    [data-theme="dark"] [data-component="GuidePage"] {
      --theme-surface: #1d1b1a;
      --color-text: #f3f2f2;
      --color-neutral-100: #141313; --color-neutral-200: #262423; --color-neutral-300: #35322f;
      --color-neutral-400: #4a4643; --color-neutral-500: #605d5d; --color-neutral-600: #8a8582;
      --color-neutral-700: #b5b0ad; --color-neutral-800: #d8d4d1; --color-neutral-900: #f3f2f2;
      --ds-brand-fill: #1e4f9c;
    }
    [data-theme="dark"] [data-component="GuidePage"] h1,
    [data-theme="dark"] [data-component="GuidePage"] h2,
    [data-theme="dark"] [data-component="GuidePage"] h3 { color: #9db6d9; }
    [data-theme="dark"] [data-component="GuidePage"] input,
    [data-theme="dark"] [data-component="GuidePage"] select,
    [data-theme="dark"] [data-component="GuidePage"] textarea { background: #262423; color: #f3f2f2; border-color: #4a4643; }
    [data-component="GuidePage"] { --field-brand: #002a6e; }
    [data-theme="dark"] [data-component="GuidePage"] { --field-brand: #12325e; }
    [data-component="GuidePage"] { --ink-brand-2: #003da5; }
    [data-theme="dark"] [data-component="GuidePage"] { --ink-brand-2: #8fb4ee; }
    [data-theme="dark"] [data-component="GuidePage"] { --ink-brand: #9db6d9; }
  </style>
</helmet>

<div data-component="GuidePage" data-screen-label="Guide" style="display:flex;flex-direction:column;height:100%;min-height:0;background:var(--surface);color:var(--color-text)">

  <div style="flex:none;padding:14px 20px 0;background:var(--surface);border-bottom:1px solid var(--field-brand)">
    <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap">
      <div style="min-width:0">
        <h1 style="font-size:18px;margin:0;line-height:1.2;letter-spacing:0.02em;text-transform:uppercase">GUIDE</h1>
        <p style="font-size:11px;margin:3px 0 0;color:var(--color-neutral-700)">{{ subtitle }}</p>
      </div>
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;width:250px;height:28px;padding:0 10px;border:1px solid var(--color-neutral-300);border-radius:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" style="flex:none;color:var(--color-neutral-500)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input value="{{ query }}" onChange="{{ setQuery }}" placeholder="Rechercher dans le guide" style="flex:1;min-width:0;height:100%;border:0;background:transparent;color:inherit;font-size:12px;outline:none" />
      </span>
    </div>
    <div data-guide-tabs="" style="display:flex;align-items:flex-end;gap:2px;margin-top:12px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="8">
        <button onClick="{{ t.onClick }}" style="display:flex;align-items:center;gap:7px;height:{{ t.height }};padding:{{ t.padding }};border:0;border-radius:6px 6px 0 0;background:{{ t.bg }};color:{{ t.fg }};font-size:{{ t.size }};font-weight:{{ t.weight }};white-space:nowrap;cursor:pointer" style-hover="filter:brightness(0.97)">
          {{ t.label }}
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 20px 24px">
    <div data-guide-split="" style="display:grid;grid-template-columns:minmax(0, 1fr) minmax(260px, 320px);gap:16px;align-items:start">

      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div style="flex:none;background:var(--surface);border:1px solid var(--color-neutral-300);border-radius:6px;overflow:hidden">
          <div style="padding:16px 18px;border-bottom:1px solid var(--color-neutral-200)">
            <h2 style="margin:0;font-size:16px">{{ topic.title }}</h2>
            <p style="margin:5px 0 0;font-size:12px;line-height:1.55;color:var(--color-neutral-700);text-wrap:pretty">{{ topic.intro }}</p>
          </div>
          <sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
            <div style="padding:14px 18px;border-bottom:1px solid var(--color-neutral-200)">
              <h3 style="margin:0 0 6px;font-size:13px">{{ s.heading }}</h3>
              <p style="margin:0;font-size:12px;line-height:1.6;color:var(--color-neutral-800);text-wrap:pretty">{{ s.body }}</p>
              <sc-if value="{{ s.hasSteps }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
                  <sc-for list="{{ s.steps }}" as="p" hint-placeholder-count="3">
                    <span style="display:flex;align-items:flex-start;gap:9px">
                      <span style="flex:none;display:flex;align-items:center;justify-content:center;width:18px;height:18px;margin-top:1px;border-radius:999px;background:var(--color-neutral-200);font-size:10px;font-weight:700;font-variant-numeric:tabular-nums">{{ p.n }}</span>
                      <span style="min-width:0;font-size:12px;line-height:1.5;color:var(--color-neutral-800);text-wrap:pretty">{{ p.text }}</span>
                    </span>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>
          <sc-if value="{{ noSections }}" hint-placeholder-val="{{ false }}">
            <p style="margin:0;padding:20px 18px;font-size:12px;color:var(--color-neutral-700)">Aucune section ne correspond à la recherche dans cette thématique.</p>
          </sc-if>
        </div>

        <div style="flex:none;background:var(--surface);border:1px solid var(--color-neutral-300);border-radius:6px;overflow:hidden">
          <div style="padding:12px 18px;border-bottom:1px solid var(--color-neutral-200)">
            <h3 style="margin:0;font-size:14px">Questions fréquentes</h3>
          </div>
          <sc-for list="{{ faq }}" as="f" hint-placeholder-count="3">
            <div style="border-bottom:1px solid var(--color-neutral-200)">
              <button onClick="{{ f.onToggle }}" style="display:flex;align-items:center;gap:10px;width:100%;padding:11px 18px;border:0;background:{{ f.bg }};color:var(--color-text);text-align:left;cursor:pointer" style-hover="background:rgba(0,61,165,0.07)">
                <span style="flex:1;min-width:0;font-size:12px;font-weight:600;text-wrap:pretty">{{ f.q }}</span>
                <span style="flex:none;font-size:14px;color:var(--color-neutral-600)">{{ f.sign }}</span>
              </button>
              <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
                <p style="margin:0;padding:0 18px 13px;font-size:12px;line-height:1.6;color:var(--color-neutral-800);text-wrap:pretty">{{ f.a }}</p>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div style="flex:none;background:var(--surface);border:1px solid var(--color-neutral-300);border-radius:6px;overflow:hidden">
          <div style="padding:12px 16px;border-bottom:1px solid var(--color-neutral-200)">
            <h3 style="margin:0;font-size:14px">Points clés</h3>
          </div>
          <sc-for list="{{ topic.keys }}" as="k" hint-placeholder-count="4">
            <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--color-neutral-200)">
              <span style="flex:none;width:6px;height:6px;margin-top:6px;border-radius:999px;background:var(--ds-brand-fill, var(--field-brand))"></span>
              <span style="min-width:0;font-size:12px;line-height:1.5;color:var(--color-neutral-800);text-wrap:pretty">{{ k }}</span>
            </div>
          </sc-for>
        </div>

        <div style="flex:none;background:var(--surface);border:1px solid var(--color-neutral-300);border-radius:6px;overflow:hidden">
          <div style="padding:12px 16px;border-bottom:1px solid var(--color-neutral-200)">
            <h3 style="margin:0;font-size:14px">Raccourcis utiles</h3>
          </div>
          <sc-for list="{{ topic.links }}" as="l" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--color-neutral-200)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:var(--color-neutral-600)"><path d="m9 18 6-6-6-6"></path></svg>
              <span style="flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ l }}</span>
            </div>
          </sc-for>
        </div>

        <div style="flex:none;background:var(--surface);border:1px solid var(--color-neutral-300);border-radius:6px;overflow:hidden">
          <div style="padding:12px 16px;border-bottom:1px solid var(--color-neutral-200)">
            <h3 style="margin:0;font-size:14px">Toutes les thématiques</h3>
          </div>
          <sc-for list="{{ topicList }}" as="t" hint-placeholder-count="8">
            <button onClick="{{ t.onClick }}" style="display:flex;align-items:center;gap:10px;width:100%;padding:9px 16px;border:0;border-left:3px solid {{ t.mark }};border-bottom:1px solid var(--color-neutral-200);background:{{ t.bg }};color:var(--color-text);text-align:left;cursor:pointer" style-hover="background:rgba(0,61,165,0.07)">
              <span style="flex:1;min-width:0;font-size:12px;font-weight:{{ t.weight }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.label }}</span>
              <span style="flex:none;font-size:10px;color:var(--color-neutral-600)">{{ t.count }}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:820}}">

  sections: [

const ACCOUNTING_TOPIC = {
  key: 'accounting', label: 'Comptabilité', icon: ICONS.reports,
  title: 'Traduction comptable des opérations titres',
  intro: "Ce que les normes imposent — IFRS 9 pour la comptabilisation, IAS 21 pour la devise, IAS 12 pour la retenue à la source — et les écritures correspondantes, confrontées à ce que fait le projecteur de l'application.",
  keys: ['Le classement IFRS 9 commande l\'évaluation : toute action est en juste valeur par résultat par défaut.',
    'Un transfert entre comptes suivis n\'est pas une cession : aucun résultat, le coût de base traverse intact.',
    'Le suspens de règlement vit entre négociation et règlement, aux comptes PCG 464 et 465.',
    'Un dividende est acquis au détachement, encaissé à la mise en paiement.'],
  links: ['Transactions', 'Comptabilité', 'Réconciliation', 'Annexes et légendes'],
  sections: [
    { heading: 'IFRS 9 — le classement commande tout', body: "Le classement découle de deux tests posés dans l'ordre : le modèle de gestion, puis la nature des flux. Faute de passer le test des flux, une action est en juste valeur par résultat, sauf option irrévocable pour les capitaux propres, ouverte instrument par instrument à la seule entrée.", steps: [
      'Coût amorti : détenu pour encaisser des flux limités au principal et aux intérêts.',
      'Juste valeur par capitaux propres : détenu pour encaisser et céder — résultat de cession jamais recyclé.',
      'Juste valeur par résultat : catégorie par défaut, variation portée au résultat à chaque arrêté.'
    ] },
    { heading: 'Les deux doctrines de comptabilisation', body: "IFRS 9 §3.1.2 laisse le choix du moment d'entrée au bilan, mais impose la constance par catégorie. En date de négociation, l'actif et sa contrepartie entrent le jour de la transaction ; en date de règlement, rien n'entre avant le dénouement, mais la variation de juste valeur doit être reconnue sur l'intervalle. Le modèle de l'application est hybride : position à la négociation, espèces au règlement — d'où l'obligation de tenir un suspens." },
    { heading: 'Le suspens de règlement', body: "Ce sont des comptes de bilan : le patrimoine total ne bouge pas entre la négociation et le règlement. Le suspens ne se stocke pas, il se déduit du couple de dates de l'opération — une opération est en suspens à une date d'arrêté si elle est négociée et pas encore réglée.", steps: [
      'PCG 464 — dettes sur acquisitions de valeurs mobilières : achat négocié, non réglé.',

      { q: 'Comment demander un accès supplémentaire ?', a: 'La demande passe par le responsable de l\'équipe de gestion, qui la transmet à l\'administration des habilitations.' }
    ]
  }
];

class Component extends DCLogic {
  state = { tab: 'start', query: '', openFaq: null };

  renderVals() {
    const topic = TOPICS.find((t) => t.key === this.state.tab) || TOPICS[0];
    const q = this.state.query.trim().toLowerCase();
    const match = (s) => !q || (s.heading + ' ' + s.body + ' ' + (s.steps || []).join(' ')).toLowerCase().indexOf(q) >= 0;
    const sections = topic.sections.filter(match);

    return {
      subtitle: topic.label + ' · ' + TOPICS.length + ' thématiques',
      query: this.state.query,
      setQuery: (e) => this.setState({ query: e.target.value }),

      tabs: TOPICS.map((t) => {
        const on = t.key === this.state.tab;
        return {
          label: t.label,
          height: on ? '40px' : '32px',
          padding: on ? '0 16px' : '0 12px',
          size: on ? '13px' : '12px',
          bg: on ? 'var(--ds-brand-fill, var(--field-brand))' : 'rgba(0,61,165,0.08)',
          fg: on ? '#ffffff' : 'var(--ink-brand)',
          borderColor: 'var(--ds-brand-fill, var(--field-brand))',
          weight: on ? '700' : '400',
          onClick: () => this.setState({ tab: t.key, openFaq: null })
        };
      }),

      topic: { title: topic.title, intro: topic.intro, keys: topic.keys, links: topic.links },
      noSections: sections.length === 0,
      sections: sections.map((s) => ({
        heading: s.heading, body: s.body,
        hasSteps: !!(s.steps && s.steps.length),
        steps: (s.steps || []).map((text, i) => ({ n: i + 1, text }))
      })),
      faq: topic.faq.map((f, i) => {
        const open = this.state.openFaq === i;
        return {
          q: f.q, a: f.a, open,
          sign: open ? '−' : '+',
          bg: open ? 'var(--color-neutral-100)' : 'var(--surface)',
          onToggle: () => this.setState((s) => ({ openFaq: s.openFaq === i ? null : i }))
        };
      }),
      topicList: TOPICS.map((t) => {
        const on = t.key === this.state.tab;
        return {
          label: t.label,
          count: t.sections.length + ' sections',
          bg: on ? 'var(--color-neutral-100)' : 'var(--surface)',
          mark: on ? 'var(--ds-brand-fill, var(--ink-brand-2))' : 'transparent',
          weight: on ? '700' : '400',
          onClick: () => this.setState({ tab: t.key, openFaq: null })
        };
      })
    };
  }
}
</script>
</body>
</html>
